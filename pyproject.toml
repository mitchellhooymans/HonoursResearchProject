[project]
name = "glass"
version = "0.1.0"
description = "GLASS: Galaxy Light & AGN Spectral Synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "astropy>=5.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.2",
    "nbformat>=5.10.4",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.25.0",
]
